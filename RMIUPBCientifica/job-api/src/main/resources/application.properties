server.port=8080

# Configuración del cliente RMI hacia gestor-cluster.
# El puerto 1099 es el del RMI Registry (descubrimiento del stub).
# La invocación real de métodos ocurre luego contra el puerto 2100,
# información que ya viaja embebida dentro del stub obtenido del Registry.
rmi.gestor.host=localhost
rmi.gestor.registryPort=1099
rmi.gestor.serviceName=JobService

logging.level.com.cluster.api=INFO
