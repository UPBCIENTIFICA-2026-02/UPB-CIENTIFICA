# job-api escucha en 8082, como dice el diagrama de despliegue y como ya
# esperaba node-web (rutas-servicio.json). Antes era 8080: node-web apuntaba a
# 8082 y no encontraba a nadie.
#
# PENDIENTE: el diagrama dice 8082 HTTPS. Aquí es HTTP; el TLS interno está
# documentado como riesgo asumido (RNF-02) en docs/TRASPASO.md.
server.port=8082

# Configuración del cliente RMI hacia gestor-cluster.
# El puerto 2099 es el del RMI Registry (descubrimiento del stub), como dice el
# diagrama; antes era 1099. La invocación real de métodos ocurre luego contra el
# puerto 2100, información que ya viaja embebida dentro del stub obtenido del
# Registry.
#
# Si se cambia, hay que cambiarlo también en gestor-cluster/Main.java y en
# scripts/start-gestor.sh: tiene que coincidir en los tres sitios.
rmi.gestor.host=localhost
rmi.gestor.registryPort=2099
# "ServicioHpc" (antes "JobService"): ver gestor-cluster/Main.java.
rmi.gestor.serviceName=ServicioHpc

logging.level.com.cluster.api=INFO
