# Nginx delante de node-web: termina TLS y publica el :443 del diagrama.
# Instalar en /etc/nginx/sites-available/node-web y enlazar en sites-enabled.

# Formato de registro SIN la query string. Lo usa la ruta del video: el
# <video> no puede poner la cabecera Authorization y manda el token como
# ?access_token=..., que con el formato normal quedaría escrito en el log.
# (Va fuera de server{}: sites-enabled se incluye dentro del bloque http.)
log_format upbc_sin_query '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name node-web.cca.upb.edu.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name node-web.cca.upb.edu.co;

    ssl_certificate     /etc/ssl/upbc/node-web.crt;
    ssl_certificate_key /etc/ssl/upbc/node-web.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cabeceras de seguridad basicas para el analisis de vulnerabilidades
    # que exige el enunciado.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 512m;

    # Video: token en la URL (ver log_format arriba) y respuestas 206 por
    # rangos. Sin búfer, para que el reproductor reciba los bytes según llegan
    # y pueda saltar en la línea de tiempo.
    location ~ ^/api/streaming/[^/]+/contenido$ {
        access_log /var/log/nginx/access.log upbc_sin_query;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
